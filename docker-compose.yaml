version: '3.8'

services:
  synapse-generate-config:
    image: matrixdotorg/synapse:latest
    volumes:
      - synapse_data:/data
    environment:
      - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME}
      - SYNAPSE_REPORT_STATS=no
    command: ["generate"]
    restart: "no"

  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    ports:
      - "8009:8008"
    volumes:
      - synapse_data:/data
    depends_on:
      - synapse-generate-config
      - postgres
      - redis

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=synapse
      - POSTGRES_USER=synapse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    volumes:
      - coturn_data:/etc/coturn
    environment:
      - EXTERNAL_IP=${VPS_PUBLIC_IP}
      - REALM=${SYNAPSE_SERVER_NAME}
      - SHARED_SECRET=${TURN_SHARED_SECRET}

volumes:
  synapse_data:
  postgres_data:
  redis_data:
  coturn_data: