version: '3.8'

services:
  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    ports:
      - "8009:8008"
    volumes:
      - synapse_data:/data
    environment:
      - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME}
      - SYNAPSE_REPORT_STATS=no
    depends_on:
      - postgres
      - redis
    # Generate config on first run
    command: >
      sh -c "
      if [ ! -f /data/homeserver.yaml ]; then
        echo 'Generating initial config...'
        python -m synapse.app.homeserver \
          --server-name=$${SYNAPSE_SERVER_NAME} \
          --config-path=/data/homeserver.yaml \
          --generate-config \
          --data-directory=/data \
          --report-stats=no
        echo 'Config generated. Please restart the container.'
        sleep 30
        exit 0
      else
        echo 'Config exists, starting Synapse...'
        python -m synapse.app.homeserver -c /data/homeserver.yaml
      fi
      "

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=synapse
      - POSTGRES_USER=synapse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    volumes:
      - coturn_data:/etc/coturn
    environment:
      - EXTERNAL_IP=${VPS_PUBLIC_IP}
      - REALM=${SYNAPSE_SERVER_NAME}
      - SHARED_SECRET=${TURN_SHARED_SECRET}
    command: >
      sh -c "
      cat > /etc/coturn/turnserver.conf << EOF
      listening-port=3478
      external-ip=$$EXTERNAL_IP
      realm=$$REALM
      use-auth-secret
      static-auth-secret=$$SHARED_SECRET
      verbose
      no-multicast-peers
      no-cli
      no-tlsv1
      no-tlsv1_1
      EOF
      && coturn -c /etc/coturn/turnserver.conf
      "

volumes:
  synapse_data:
  postgres_data:
  redis_data:
  coturn_data: